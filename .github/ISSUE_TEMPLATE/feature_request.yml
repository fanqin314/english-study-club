name: 功能建议
description: 提出一个新功能或改进想法
labels: [enhancement]
body:
  - type: textarea
    id: feature
    attributes:
      label: 功能描述
      description: 你想要什么新功能？解决什么问题？
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: 使用场景
      description: 在什么场景下会用到这个功能？
  - type: textarea
    id: alternative
    attributes:
      label: 替代方案
      description: 有没有考虑过其他实现方式？
