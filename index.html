    <script>
      (function () {
        function isNarrow() { return window.matchMedia('(max-width: 768px)').matches; }
        if (isNarrow()) { window.location.replace('mobile/index.html'); return; }
        var t;
        window.addEventListener('resize', function () {
          clearTimeout(t);
          t = setTimeout(function () { if (isNarrow()) window.location.replace('mobile/index.html'); }, 300);
        });
      })();
    </script>

                }
            } else {
                console.error('MainButtonManager 未加载');
            }

            const GlobalManager = ModuleRegistry.get('GlobalManager');
            if (GlobalManager) {
                GlobalManager.initialize({
                    VocabData: window.VocabData,
                    HistoryManager: window.HistoryManager,
                    APIRequest: window.APIRequest,
                    SentenceRenderer: window.SentenceRenderer,
                    CacheManager: window.CacheManager,
                    MainButtonManager: window.MainButtonManager,
                    FlashcardMode: window.FlashcardMode,
                    FlashcardUI: window.FlashcardUI,
                    NotebookTabUI: window.NotebookTabUI
                });
                console.log('GlobalManager 初始化完成');
            }

            const copyBtn = document.getElementById('copyOriginalTextBtn');
            if (copyBtn) {
                const tooltip = copyBtn.querySelector('.tooltip');

                // 备用复制方法：使用文本区域选择
                function fallbackCopy(text) {
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-9999px';
                    textArea.style.top = '-9999px';
                    document.body.appendChild(textArea);
                    textArea.select();

                    try {
                        const successful = document.execCommand('copy');
                        document.body.removeChild(textArea);
                        return successful;
                    } catch (err) {
                        document.body.removeChild(textArea);
                        return false;
                    }
                }

                copyBtn.addEventListener('click', async () => {
                    const content = document.getElementById('originalTextContent');
                    if (!content) return;

                    const textToCopy = content.textContent;
                    let success = false;

                    // 首先尝试使用 Clipboard API
                    if (navigator.clipboard && window.isSecureContext) {
                        try {
                            await navigator.clipboard.writeText(textToCopy);
                            success = true;
                        } catch (err) {
                            console.warn('Clipboard API 失败，尝试备用方法:', err);
                        }
                    }

                    // 如果 Clipboard API 失败或不可用，使用备用方法
                    if (!success) {
                        success = fallbackCopy(textToCopy);
                    }

                    if (success) {
                        // 切换按钮状态
                        copyBtn.classList.add('copied');
                        if (tooltip) {
                            tooltip.textContent = '已复制';
                        }

                        // 3秒后恢复原始状态
                        setTimeout(() => {
                            copyBtn.classList.remove('copied');
                            if (tooltip) {
                                tooltip.textContent = '复制原文';
                            }
                        }, 3000);

                        const toast = document.getElementById('toast');
                        if (toast) {
                            toast.innerText = '文本已复制到剪贴板';
                            toast.style.opacity = '1';
                            setTimeout(() => toast.style.opacity = '0', 2000);
                        }
                    } else {
                        const toast = document.getElementById('toast');
                        if (toast) {
                            toast.innerText = '复制失败，请手动复制';
                            toast.style.opacity = '1';
                            setTimeout(() => toast.style.opacity = '0', 2000);
                        }
                    }
                });
            }

            window.EnglishStudyClub = {
                ModuleRegistry: window.ModuleRegistry,
                MainButtonManager: window.MainButtonManager,
                SentenceRenderer: window.SentenceRenderer,
                CacheManager: window.CacheManager,
                APIRequest: window.APIRequest,
                VocabData: window.VocabData,
                HistoryManager: window.HistoryManager,
                FlashcardMode: window.FlashcardMode,
                FlashcardUI: window.FlashcardUI,
                GlobalManager: GlobalManager
            };
        });
    </script>
</body>
</html>
